<!-- Sin manifest, Android no la instala como app y iOS la abre con la barra
     del navegador encima. El icono va aparte porque un manifest no admite
     data: para los iconos en todos los navegadores. -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ariel">
<title>Ariel</title>
<style>
:root{
  --fondo:#0F1D21; --sup:#16292E; --linea:#233D42;
  --texto:#E7DECF; --tenue:#8AA0A2;
  --si:#79C0A6; --no:#D9A05B; --mal:#B4503F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --cuerpo:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);
  -webkit-font-smoothing:antialiased;line-height:1.45;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 44px)}
.envoltorio{max-width:660px;margin:0 auto;padding:0 20px}
.etiqueta{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tenue)}

header{padding:26px 0 18px;display:flex;align-items:center;gap:12px}
header h1{font-size:23px;font-weight:600;letter-spacing:.02em}
.estado{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.estado.prueba{color:var(--no)} .estado.real{color:var(--si)}

/* Calendario */
.calendario{display:flex;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--linea);
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.calendario button{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--linea);color:var(--tenue);
  padding:7px 13px;border-radius:999px;white-space:nowrap;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.calendario button[aria-pressed="true"]{background:var(--texto);color:var(--fondo);border-color:var(--texto)}
.rango{display:flex;gap:8px;align-items:center;padding:12px 0 0}
.rango input{background:var(--sup);border:1px solid var(--linea);color:var(--texto);
  font-family:var(--mono);font-size:12px;padding:6px 9px;border-radius:7px;flex:1;min-width:0}

/* Cifra principal */
.cabecera-cifra{padding:24px 0 20px;border-bottom:1px solid var(--linea)}
.cifra{font-size:52px;font-weight:200;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums;margin-top:6px}
.cifra.pos{color:var(--si)} .cifra.neg{color:var(--mal)}
.subcifra{font-family:var(--mono);font-size:12px;color:var(--tenue);margin-top:9px}

.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linea);
  border:1px solid var(--linea);border-radius:11px;overflow:hidden;margin-top:16px}
.celda{background:var(--sup);padding:13px 15px}
.celda .v{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;margin-top:3px}

section{padding:24px 0;border-bottom:1px solid var(--linea)}
section > .etiqueta{display:block;margin-bottom:14px}
.vacio{border:1px dashed var(--linea);border-radius:11px;padding:18px;color:var(--tenue);font-size:14px}
.vacio strong{display:block;color:var(--texto);font-weight:500;margin-bottom:4px}

svg{display:block;width:100%;height:auto;overflow:visible}
.pares .fila{display:flex;align-items:center;gap:10px;padding:7px 0}
.pares .par{font-family:var(--mono);font-size:12px;width:74px;flex:none}
.pares .pista{flex:1;height:9px;background:var(--sup);border-radius:2px;position:relative;overflow:hidden}
.pares .relleno{position:absolute;top:0;bottom:0;border-radius:2px}
.pares .val{font-family:var(--mono);font-size:12px;width:76px;text-align:right;flex:none;
  font-variant-numeric:tabular-nums}

.op .detalle{font-family:var(--mono);font-size:11px;color:var(--tenue);margin-top:8px;
  line-height:1.65}
.marcas{display:flex;gap:5px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.marca{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;

.marca.hecha{border-color:var(--si);color:var(--si)}
.marca.viva{border-color:var(--no);color:var(--no)}

details{background:var(--sup);border-radius:11px;margin-bottom:8px;overflow:hidden}
summary{padding:13px 15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px;font-size:14px}
summary::-webkit-details-marker{display:none}
summary .cuenta{font-family:var(--mono);font-size:12px;color:var(--fondo);background:var(--no);
  border-radius:4px;padding:2px 7px;flex:none;font-variant-numeric:tabular-nums}
summary .flecha{margin-left:auto;color:var(--tenue);font-size:11px}
details[open] summary .flecha{transform:rotate(90deg)}
.ejemplos{padding:0 15px 12px;border-top:1px solid var(--linea)}
.ejemplo{font-family:var(--mono);font-size:11px;color:var(--tenue);padding:8px 0;

.ejemplo:last-child{border-bottom:none}
.ejemplo b{color:var(--texto);font-weight:500}

footer{padding:20px 0;color:var(--tenue);font-size:11px;font-family:var(--mono)}

const $ = id => document.getElementById(id);
const EUR = D.cuenta && D.cuenta.divisa ? " " + D.cuenta.divisa : "";
let dias = 0, rangoManual = null;

const fecha = o => (o.cierre || o.apertura || "").slice(0,10);
const signo = v => (v >= 0 ? "+" : "");
const importe = v => signo(v) + v.toFixed(2) + EUR;
// 1.1639599999999999 -> 1.16396. Redondea y quita los ceros de la cola.
const precio = v => v === null || v === undefined ? "?"
  : String(Number(Number(v).toFixed(5)));
const corta = t => !t ? "" : t.slice(8,10)+"/"+t.slice(5,7)+" "+t.slice(11,16);

function dentro(iso){
  if (!iso) return false;
  const d = iso.slice(0,10);
  if (rangoManual) return d >= rangoManual[0] && d <= rangoManual[1];
  if (dias === 0) return true;
  const limite = new Date(); limite.setDate(limite.getDate() - (dias - 1));
  return d >= limite.toISOString().slice(0,10);
}

function pintar(){
  const ops = D.operaciones.filter(o => dentro(o.cierre || o.apertura));
  const desc = D.descartes.filter(x => dentro(x.ts));
  const cerradas = ops.filter(o => !o.abierta && o.pl !== null);
  const abiertas = ops.filter(o => o.abierta);
  const simuladas = ops.filter(o => o.simulada);
  const hayEuros = D.cuenta !== null;

  // Cifra principal: beneficio si hay euros, media en R si el panel es publico
  const benef = cerradas.reduce((a,o) => a + (o.pl || 0), 0);
  const erres = cerradas.map(o => o.r).filter(r => r !== null);
  const rMedia = erres.length ? erres.reduce((a,b)=>a+b,0)/erres.length : null;

  if (hayEuros){
    $("tituloCifra").textContent = "Beneficio del periodo";
    $("cifra").textContent = cerradas.length ? importe(benef) : "—";
    $("cifra").className = "cifra " + (benef >= 0 ? "pos" : "neg");
    $("subcifra").textContent = `Saldo ${D.cuenta.saldo.toFixed(2)}`
      + (D.cuenta.divisa ? " " + D.cuenta.divisa : "") +
      (D.cuenta.equity !== D.cuenta.saldo ? ` · con abiertas ${D.cuenta.equity.toFixed(2)}` : "");
  } else {
    $("tituloCifra").textContent = "Resultado medio del periodo";
    $("cifra").textContent = rMedia === null ? "—" : signo(rMedia) + rMedia.toFixed(2) + "R";
    $("cifra").className = "cifra " + (rMedia >= 0 ? "pos" : "neg");
    $("subcifra").textContent = "Modo publico: sin importes ni saldo. "
      + "Pon PANEL_PUBLICO=false en el .env para ver euros.";
  }

  const ganadoras = cerradas.filter(o => o.pl > 0).length;
  $("metricas").innerHTML = [
    [D.dry_run ? "Habria operado" : "Cerradas", D.dry_run ? simuladas.length : cerradas.length],
    ["Abiertas", abiertas.length],
    ["Acertadas", cerradas.length ? `${ganadoras}/${cerradas.length}` : "—"],
    ["Media en R", rMedia === null ? "—" : signo(rMedia) + rMedia.toFixed(2) + "R"],
  ].map(([k,v]) => `<div class="celda"><span class="etiqueta">${k}</span><div class="v">${v}</div></div>`).join("");

  pintarCurva(cerradas);
  pintarPares(cerradas);
  pintarOperaciones(ops);
  pintarDescartes(desc);
}

function pintarCurva(cerradas){
  if (cerradas.length < 2){
    $("curva").innerHTML = `<div class="vacio"><strong>Faltan operaciones</strong>
      La curva aparece a partir de la segunda operacion cerrada del periodo.</div>`;
    return;
  }
  const orden = [...cerradas].sort((a,b) => (a.cierre||"").localeCompare(b.cierre||""));
  let acc = 0;
  const serie = orden.map(o => acc += (D.cuenta ? (o.pl||0) : (o.r||0)));
  const min = Math.min(0, ...serie), max = Math.max(0, ...serie);
  const W = 320, H = 120, m = 6;
  const x = i => m + i * (W - 2*m) / (serie.length - 1);
  const y = v => H - m - (v - min) / ((max - min) || 1) * (H - 2*m);
  const linea = serie.map((v,i) => `${x(i)},${y(v)}`).join(" ");
  const area = `${x(0)},${y(min)} ${linea} ${x(serie.length-1)},${y(min)}`;
  const fin = serie[serie.length-1];
  const color = fin >= 0 ? "var(--si)" : "var(--mal)";
  $("curva").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:120px">
    <polygon points="${area}" fill="${color}" opacity=".12"></polygon>
    <line x1="${m}" x2="${W-m}" y1="${y(0)}" y2="${y(0)}" stroke="var(--linea)" stroke-width="1"></line>
    <polyline points="${linea}" fill="none" stroke="${color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"></polyline>
    <circle cx="${x(serie.length-1)}" cy="${y(fin)}" r="3.5" fill="${color}"></circle>
  </svg>
  <div class="subcifra">${serie.length} operaciones · acumulado ${D.cuenta ? importe(fin) : signo(fin)+fin.toFixed(2)+"R"}</div>`;
}

function pintarPares(cerradas){
  if (!cerradas.length){
    $("pares").innerHTML = `<div class="vacio"><strong>Sin datos por par</strong>
      Cada par aparecera aqui con lo que ha aportado, para ver donde gana y donde pierde.</div>`;
    return;
  }
  const acum = {};
  cerradas.forEach(o => {
    const v = D.cuenta ? (o.pl||0) : (o.r||0);
    if (!acum[o.symbol]) acum[o.symbol] = {v:0, n:0};
    acum[o.symbol].v += v; acum[o.symbol].n++;
  });
  const filas = Object.entries(acum).sort((a,b) => b[1].v - a[1].v);
  const tope = Math.max(...filas.map(([,d]) => Math.abs(d.v))) || 1;
  $("pares").innerHTML = filas.map(([par,d]) => {
    const pos = d.v >= 0;
    const ancho = Math.abs(d.v)/tope*50;
    const val = D.cuenta ? importe(d.v) : signo(d.v)+d.v.toFixed(2)+"R";
    return `<div class="fila">
      <span class="par">${par}</span>
      <span class="pista"><span class="relleno" style="background:var(${pos?"--si":"--mal"});
        left:${pos?50:50-ancho}%;width:${ancho}%"></span></span>
      <span class="val ${pos?"pos":"neg"}">${val}</span>
    </div>`;
  }).join("") + `<div class="subcifra">${filas.map(([p,d]) => p+" "+d.n).join(" · ")}</div>`;
}

let pestana = "abiertas";

function pintarOperaciones(todas){
  // se separan por estado: con muchas operaciones la lista unica no se lee
  const abiertas = todas.filter(o => o.abierta);
  const cerradas = todas.filter(o => !o.abierta);
  [...$("pestanas").children].forEach(b => {
    const n = b.dataset.t === "abiertas" ? abiertas.length : cerradas.length;
    b.textContent = (b.dataset.t === "abiertas" ? "Abiertas " : "Cerradas ") + n;
    b.setAttribute("aria-pressed", b.dataset.t === pestana);
  });
  const ops = pestana === "abiertas" ? abiertas : cerradas;
  if (!ops.length){
    $("operaciones").innerHTML = `<div class="vacio"><strong>Ninguna operacion en este periodo</strong>
      Cambia el filtro de fechas o espera a la proxima señal.</div>`;
    return;
  }
  $("operaciones").innerHTML = ops.map(o => {
    const v = o.pl !== null ? o.pl : o.r;
    const txt = o.pl !== null ? importe(o.pl) : (o.r !== null ? signo(o.r)+o.r+"R" : "");
    const extra = (o.pl !== null && o.r !== null) ? `<small>${signo(o.r)}${o.r}R</small>` : "";
    const res = txt ? `<span class="res ${v>=0?"pos":"neg"}">${txt}${extra}</span>` : "";
    const marcas = [1,2,3].map(n =>
      `<span class="marca ${o.parciales.includes(String(n))?"hecha":""}">TP${n}</span>`).join("")
      + `<span class="marca ${o.be?"hecha":""}">BE</span>`
      + (o.abierta ? `<span class="marca viva">abierta</span>` : "")
      + (o.simulada ? `<span class="marca">simulada</span>` : "");
    return `<div class="op">
      <div class="cab"><span class="par">${o.symbol||"?"}</span>
        <span class="lado">${o.dir||""}</span>${res}</div>
      <div class="detalle">${corta(o.apertura)}${o.lote?" · "+o.lote+" lotes":""}
        <br>entrada ${precio(o.entrada)}${o.sl?" · SL "+precio(o.sl):""}
        ${o.salida?"<br>salida "+precio(o.salida)+" · "+corta(o.cierre):""}</div>
      <div class="marcas">${marcas}</div>
    </div>`;
  }).join("");
}

function pintarDescartes(desc){
  if (!desc.length){
    $("descartes").innerHTML = `<div class="vacio"><strong>Ninguna señal descartada</strong>
      Cuando Ariel rechace una, aqui veras el motivo y podras abrirlo para ver cuales.</div>`;
    return;
  }
  const grupos = {};
  desc.forEach(x => (grupos[x.motivo] = grupos[x.motivo] || []).push(x));
  $("descartes").innerHTML = Object.entries(grupos)
    .sort((a,b) => b[1].length - a[1].length)
    .map(([motivo, lista]) => `<details>
      <summary><span class="cuenta">${lista.length}</span>${motivo}<span class="flecha">›</span></summary>
      <div class="ejemplos">${lista.slice(0,8).map(e =>
        `<div class="ejemplo"><b>${e.symbol||"?"} ${e.dir||""}</b> · ${e.ts.replace("T"," ").slice(0,16)}<br>${e.detalle}</div>`
      ).join("")}</div></details>`).join("");
}

$("pestanas").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pestana = b.dataset.t;
  pintar();
});

// Calendario
$("calendario").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  [...$("calendario").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  const d = Number(b.dataset.dias);
  if (d === -1){ $("rango").hidden = false; return; }
  $("rango").hidden = true; rangoManual = null; dias = d; pintar();
});
["desde","hasta"].forEach(id => $(id).addEventListener("change", () => {
  const a = $("desde").value, b = $("hasta").value;
  if (a && b){ rangoManual = [a, b]; pintar(); }
}));

$("estado").textContent = D.modo;
$("estado").className = "estado " + (D.dry_run ? "prueba" : "real");
$("pie").textContent = `Generado el ${D.generado} · riesgo ${D.riesgo_pct}% por operacion` +
  (D.desde ? ` · datos desde el ${D.desde.split("-").reverse().join("/")}` : "");
pintar();
</script>
</body>
</html>
